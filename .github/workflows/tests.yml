name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.5'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  # Setelah test lulus di main: build tampilan lalu simpan source + public/build ke
  # branch "production". Server cukup `git pull origin production` (lihat DEPLOY.md).
  production:
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Enable pnpm
        run: corepack enable

      - name: Build tampilan
        run: |
          composer install --no-dev --no-interaction --prefer-dist
          cp .env.example .env
          php artisan key:generate
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Simpan ke branch production
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/build
          TREE=$(git write-tree)
          git fetch origin production || true
          PARENT=$(git rev-parse -q --verify origin/production || true)
          COMMIT=$(git commit-tree "$TREE" ${PARENT:+-p "$PARENT"} -m "Build production dari ${GITHUB_SHA::7}")
          git push origin "$COMMIT:refs/heads/production"
